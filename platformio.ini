[env:esp32dev]
platform = espressif32@6.5.0
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI
    lvgl/lvgl@8.3.11

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=172
    -D TFT_HEIGHT=320

    -D TFT_MOSI=6
    -D TFT_SCLK=7
    -D TFT_CS=14
    -D TFT_DC=15
    -D TFT_RST=21
    -D TFT_BL=22

    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SPI_FREQUENCY=40000000