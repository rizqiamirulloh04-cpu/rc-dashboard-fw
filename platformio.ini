[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lvgl/lvgl@^9.1.0
    bodmer/TFT_eSPI

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -D USER_SETUP_LOADED
    -I include

board_build.flash_mode = dio
board_build.f_cpu = 160000000L