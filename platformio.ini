[env:esp32-c6-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.5

build_flags =
    -D USER_SETUP_LOADED=1

    ; ST7789
    -D ST7789_DRIVER
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=172

    ; SPI pins
    -D TFT_MOSI=6
    -D TFT_SCLK=7
    -D TFT_CS=14
    -D TFT_DC=15
    -D TFT_RST=21

    ; Fonts
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT

    ; Speed
    -D SPI_FREQUENCY=40000000

board_build.flash_mode = dio
board_build.f_cpu = 160000000L

build_unflags =
    -std=gnu++11

build_flags =
    ${env.build_flags}
    -std=gnu++17